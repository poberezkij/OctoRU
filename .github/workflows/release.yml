name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run release checks
        run: xvfb-run --auto-servernum npm run release:check

      - name: Prepare release artifact
        run: npm run release:zip

      - name: Resolve release notes
        id: notes
        shell: bash
        run: |
          if [ -f "RELEASE_NOTES_${GITHUB_REF_NAME}.md" ]; then
            echo "path=RELEASE_NOTES_${GITHUB_REF_NAME}.md" >> "$GITHUB_OUTPUT"
          elif [ -f "RELEASE_NOTES_${GITHUB_REF_NAME#v}.md" ]; then
            echo "path=RELEASE_NOTES_${GITHUB_REF_NAME#v}.md" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: ${{ steps.notes.outputs.path != '' }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: "OctoRU ${{ github.ref_name }}"
          draft: false
          prerelease: false
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            dist/OctoRU-${{ github.ref_name }}.zip

      - name: Create GitHub Release (no notes file)
        if: ${{ steps.notes.outputs.path == '' }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: "OctoRU ${{ github.ref_name }}"
          draft: false
          prerelease: false
          body: |
            Release ${{ github.ref_name }}
          files: |
            dist/OctoRU-${{ github.ref_name }}.zip
